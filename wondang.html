<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F5">
<title>장수 매장앱 · 원당</title>
<link rel="manifest" href="manifest-wondang.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="원당 매장">
<!-- 🔴 구글 폰트를 뺐습니다 (2026-10-01 · 사장님 확인)
     IBM Plex Sans KR 은 한글이라 조각 282개로 쪼개져 있습니다.
     한글 화면이면 수십 개를 받고, 굵기 3종이라 ×3 입니다.
     ⚠️ 용량보다 **요청 횟수**가 문제였습니다. 매장 와이파이에서 수십 번 왕복하는
        동안 화면이 멎었습니다. 게다가 <link rel=stylesheet> 는 렌더를 막는 자리입니다.
     → 아이폰은 애플 산돌고딕, 갤럭시는 노토산스를 씁니다. 둘 다 깔끔한 한글 글꼴입니다.
     ⚠️ 글꼴을 다시 넣고 싶으면 body 의 font-family 만 바꾸면 됩니다.
        다만 「주춤거리면 아무도 안 쓴다」가 이 앱의 기준입니다. -->
<style>
:root{
  --paper:#F4F6F5; --surface:#FFFFFF; --ink:#1C2529; --muted:#5E6B70; --line:#DCE2E0;
  --char:#24323A; --beef:#B3261E; --done:#2E7D4F; --accent:#1F6F8B; --warm:#A8741A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12191C; --surface:#1B2428; --ink:#E8EEEC; --muted:#9AA8AC; --line:#2C383D;
    --char:#0C1215; --beef:#E5675E; --done:#5BB585; --accent:#5BB2D1; --warm:#D9A44A;
  }
}
:root[data-theme="dark"]{
  --paper:#12191C; --surface:#1B2428; --ink:#E8EEEC; --muted:#9AA8AC; --line:#2C383D;
  --char:#0C1215; --beef:#E5675E; --done:#5BB585; --accent:#5BB2D1; --warm:#D9A44A;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",
              "Malgun Gothic",system-ui,"Helvetica Neue",sans-serif;
  font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;word-break:keep-all;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
/* ⚠️ 26-10-02 「페이지 넘기는 속도가 느림」 — 두 번 눌러 확대를 기다리는 틈(최대 0.3초)을 없앱니다 */
html{touch-action:manipulation}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:480px;margin:0 auto}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{display:flex;justify-content:space-between;align-items:center;padding:14px 20px 10px}
.app-name{font-weight:700;font-size:19px}
.app-name small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.demo{font-size:12px;color:var(--warm);border:1px solid var(--warm);border-radius:6px;padding:2px 7px;white-space:nowrap}

main{padding:14px 20px 110px}
.screen{display:none}.screen.on{display:block}
h2{font-size:17px;margin:24px 0 8px}
h2:first-child{margin-top:4px}
h3{font-size:14px;color:var(--muted);font-weight:500;margin:16px 0 6px}
.hint{color:var(--muted);font-size:14px;margin:0 0 10px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
/* ⚠️ box-sizing 을 직접 적습니다 (26-10-01) — 접히는 묶음(details) 안의 줄은 물려받지 못해
   폭이 37px 넘쳐 🛒 가 잘렸습니다. 「마감체크 폰화면 밀림」의 원인 */
.row{box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0;min-height:52px}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .sub{display:block;font-size:13px;color:var(--muted)}
.tag{font-size:12px;padding:3px 8px;border-radius:6px;white-space:nowrap;font-weight:500}
.tag.warn{background:color-mix(in srgb,var(--beef) 14%,transparent);color:var(--beef)}
.tag.ok{background:color-mix(in srgb,var(--done) 14%,transparent);color:var(--done)}
.tag.wait{background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--muted)}
.tag.info{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.ok{background:var(--done)}.dot.bad{background:var(--beef)}.dot.idle{background:var(--line)}

.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:15px;color:transparent}
.on-check .check{background:var(--done);border-color:var(--done);color:#fff}
.on-check .main{color:var(--muted);text-decoration:line-through}
.carried .main{color:var(--muted)}
.carried .check{border-style:dashed}

.icon-btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;height:36px;min-width:40px;padding:0 8px;font-size:15px;flex:none}
.icon-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}

.banner{border-radius:14px;padding:14px 16px;margin-bottom:12px;display:flex;gap:12px;align-items:flex-start}
.banner b{display:block}
.banner span{font-size:14px}
.banner.green{background:color-mix(in srgb,var(--done) 14%,var(--surface));}
.banner.warn{background:color-mix(in srgb,var(--warm) 14%,var(--surface));}
.banner.red{background:color-mix(in srgb,var(--beef) 12%,var(--surface));}
.banner .em{font-size:24px;line-height:1.2}

.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;padding:11px 0;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

.supbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -20px 12px;padding-left:20px;padding-right:20px;scrollbar-width:none}
.supbar::-webkit-scrollbar{display:none}
.supbar button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-size:15px;position:relative}
.supbar button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:700}
.supbar .cnt{margin-left:6px;font-size:12px;background:var(--accent);color:#fff;border-radius:99px;padding:1px 7px}
/* 이미 발주가 나간 업체 — 눈에 바로 들어와야 합니다 (사장님 요청 26-10-01) */
.supbar button.sent{background:color-mix(in srgb,var(--done) 16%,var(--surface));border-color:var(--done)}
.supbar .sentmark{margin-left:6px;font-size:12px;background:var(--done);color:#fff;border-radius:99px;padding:1px 7px;font-weight:500}

.val{min-width:76px;height:42px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);font-weight:700;font-size:18px;text-align:right;padding:0 10px}
.val.empty{color:var(--muted);font-weight:400}
.val small{font-size:13px;font-weight:400;color:var(--muted);margin-left:3px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:18px}
.qty output{min-width:26px;text-align:center;font-weight:700}

.calc{background:var(--char);color:#fff;border-radius:14px;padding:14px 16px;margin-top:12px}
.calc .big{font-size:26px;font-weight:700}
.calc .sm{font-size:13px;opacity:.8}

.ctabs{display:flex;gap:6px;margin:4px 0 12px;position:sticky;top:0;z-index:5;background:var(--paper);padding:6px 0}
.ctabs button{flex:1;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;font-weight:600;font-size:14px;color:var(--muted)}
.ctabs button small{display:block;font-size:11px;font-weight:700;opacity:.8}
.ctabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.ctabs button.all{border-color:var(--done);color:var(--done)}
.ctabs button.all[aria-pressed="true"]{background:var(--done);color:#fff}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--done);transition:width .2s}

details.grp{border-top:1px solid var(--line)}
details.grp:first-child{border-top:0}
details.grp summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;font-weight:500}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary::after{content:"▾";color:var(--muted);transition:transform .15s}
details.grp[open] summary::after{transform:rotate(180deg)}
/* 🎨 26-10-14 사장님: 「대분류(아코디언) 소분류 … 대분류에 색칠을 해줘 … 하위항목들과 구분되게 카드 바탕에 색」
   묶음마다 --gc 한 색 → 머리줄 바탕은 옅게 · 왼쪽 굵은 띠 · 이름은 진하게. 펼친 안쪽은 아주 옅게 */
details.grp[style*="--gc"] summary{background:color-mix(in srgb,var(--gc) 17%,var(--surface));box-shadow:inset 6px 0 0 var(--gc);font-weight:700}
details.grp[style*="--gc"][open] summary{background:color-mix(in srgb,var(--gc) 26%,var(--surface))}
details.grp[style*="--gc"] .row{background:color-mix(in srgb,var(--gc) 5%,var(--surface));box-shadow:inset 6px 0 0 color-mix(in srgb,var(--gc) 45%,transparent)}
/* 📅 고기 요일 칸 */
.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.dayrow.need{box-shadow:inset 0 0 0 2px var(--beef);background:color-mix(in srgb,var(--beef) 8%,var(--surface))}
.dayrow{padding-top:6px;padding-bottom:10px;background:color-mix(in srgb,var(--warm) 6%,var(--surface))}
.days{display:flex;gap:4px;flex:1;justify-content:flex-end}
.days button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:0}
.days button[aria-pressed="true"]{background:var(--warm);border-color:var(--warm);color:#fff}
details.grp .row{padding-left:28px;background:color-mix(in srgb,var(--paper) 50%,var(--surface))}

.big-btn{width:100%;border:0;border-radius:14px;background:var(--accent);color:#fff;padding:16px;font-weight:700;font-size:17px;margin-top:16px}
.big-btn:disabled{opacity:.4;cursor:not-allowed}
.big-btn.sec{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.link-btn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:12px;width:100%}
.ghost{background:transparent;border:1.5px dashed var(--line);color:var(--muted);border-radius:14px;padding:30px 16px;width:100%;text-align:center;display:block;cursor:pointer}
.ghost b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.sentbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;white-space:pre-wrap;font-size:14px}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;background:var(--line)}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:flex}
nav.tabs button{flex:1;border:0;background:transparent;padding:9px 0 11px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs .ic{font-size:20px;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
nav.tabs .badge{position:absolute;top:5px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--beef)}

.today{background:var(--char);color:#fff;border-radius:18px;padding:14px 16px 6px;margin-bottom:6px}
.today-h{font-size:13px;opacity:.75;margin-bottom:4px}
.today-r{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid #ffffff1f}
.today-r:first-of-type{border-top:0}
.today-r .em{font-size:22px;line-height:1.25}
.today-r b{display:block;font-size:17px}
.today-r span{font-size:15px;opacity:.85}
.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.doc{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:16px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.doc .e{font-size:26px;line-height:1}
.doc small{color:var(--muted);font-size:12px}
.doc{cursor:pointer}
.doc:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.doc.sel,.doc[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.field{width:100%;height:50px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-size:17px;padding:0 14px}
.fields{display:grid;grid-template-columns:2fr 1.3fr;gap:8px;margin-top:12px}
.qerr{display:block;font-size:13px;color:var(--beef)}
/* 아래에서 올라오는 판 */
.ov{position:fixed;inset:0;z-index:20;background:#0009;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:88%;overflow-y:auto}
.sheet h2{margin-top:0}
.pad-disp{font-size:40px;font-weight:700;text-align:right;padding:4px 6px 12px;border-bottom:2px solid var(--accent);margin-bottom:12px}
.pad-disp small{font-size:18px;color:var(--muted);font-weight:400;margin-left:4px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:58px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:22px;font-weight:500}
.cashrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cashsum{font-size:28px;font-weight:700;text-align:center;margin:16px 0 4px;color:var(--beef)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .big-btn{margin-top:0}

.icon-btn.q{min-width:36px;font-weight:700;color:var(--accent)}
/* ❓ 기준·방법 — 기존 마감 앱과 같은 꼴 */
.man-step{margin-top:14px}.man-step:first-child{margin-top:4px}
.man-img{width:100%;border-radius:12px;display:block;border:1px solid var(--line);background:var(--paper)}
.man-cap{font-size:12px;color:var(--muted);margin:6px 2px 10px;text-align:center}
.man-l{display:flex;gap:9px;margin-bottom:11px;align-items:flex-start}
.man-n{flex:0 0 22px;height:22px;border-radius:50%;background:var(--char);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:2px}
.man-tx{flex:1;font-size:15px;line-height:1.65}
.man-tt{font-weight:700;margin-bottom:3px}
.man-bad{margin-top:14px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--beef) 12%,var(--surface));font-size:14px}
.man-why{margin-top:10px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--warm) 14%,var(--surface));font-size:14px}
.man-txt{white-space:pre-wrap;font-size:15px;line-height:1.7}
.newver{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:40;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:11px 18px;font-weight:700;font-size:15px;box-shadow:0 4px 16px #0003;display:none;white-space:nowrap}
.newver.show{display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--char);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}

button:focus-visible,summary:focus-visible,.ghost:focus-within{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>
/* 🧽 청소 카드 — 카드마다 색 (사장님 「각 카드별로 색칠해서 구분」) */
.cl-card{margin-bottom:10px;border-radius:16px;background:color-mix(in srgb,var(--c) 9%,var(--surface));border-left:6px solid var(--c);overflow:hidden}
.cl-card .list{border:0;border-radius:0;background:transparent}
.cl-card summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.cl-card summary::-webkit-details-marker{display:none}
.cl-card summary .main{flex:1}.cl-card summary .sub{display:block;font-size:13px;color:var(--muted)}
.cl-card details .row,.cl-card .row{background:transparent}

/* 🧾 영수증 올리는 동안 (26-10-23 사장님 「영수증 올릴 때 애니메이션 넣어서 잠시 대기 · 재밌는 느낌으로」)
   다 올라갈 때까지 화면을 붙잡아 둠 — 아이폰은 앱을 내리면 올리기가 멈춤 · transform/opacity 만 움직임 */
#upOv{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--paper) 94%,transparent);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#upOv.show{display:flex}
.up-sky{position:relative;width:220px;height:200px}
.up-cloud{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-size:64px;animation:upBob 2.2s ease-in-out infinite}
.up-rc{position:absolute;left:50%;bottom:0;width:46px;height:58px;margin-left:-23px;border-radius:4px;background:#fff;box-shadow:0 3px 10px #0002;opacity:0;animation:upFly 1.8s cubic-bezier(.3,.6,.4,1) infinite}
.up-rc::before{content:"";position:absolute;left:8px;right:8px;top:10px;height:30px;background:repeating-linear-gradient(#cfd6db 0 3px,transparent 3px 8px)}
.up-rc::after{content:"₩";position:absolute;right:6px;bottom:3px;font-size:12px;font-weight:900;color:var(--accent)}
.up-rc:nth-child(3){animation-delay:.6s;--r:14deg}.up-rc:nth-child(4){animation-delay:1.2s;--r:-12deg}
@keyframes upFly{0%{opacity:0;transform:translateY(0) rotate(0) scale(.8)}15%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(-140px) rotate(var(--r,6deg)) scale(.35)}}
@keyframes upBob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
#upOv b{font-size:19px;margin-top:6px}#upOv .up-t{color:var(--muted);font-size:14px;margin-top:6px;min-height:20px}
.up-bar{width:220px;height:8px;border-radius:9px;background:var(--line);margin-top:14px;overflow:hidden}.up-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
#upOv .up-warn{margin-top:14px;font-size:13px;font-weight:700;color:var(--beef)}
@media (prefers-reduced-motion:reduce){.up-rc,.up-cloud{animation:none}}
</style>
</head>
<body>

<script>
/* ══════════════════════════════════════════════════════════
   장수 매장앱 (직원용) — 원당 · 2026-10-18
   사장님: 「원당 통합앱(직원) — 백석과 다르게 탭은 5개가 아닌 3개만 존재 (식자재발주, 청소체크, 영수증)」

   서버  식자재 = 원당 발주 GAS (food_order · 바로 발송 · 연중무휴) · 청소 = 마감 GAS 월간(branch wondang) · 영수증 = 손익 GAS (원당점)

  closeGas: 'https://script.google.com/macros/s/AKfycbxeauYyGzxWMcPSrpHAidBAnYMuIZW3XqmGg1gTomZfuM7vdmfJl2y-VG1Hk72ohFhTZg/exec',
  receiptGas: 'https://script.google.com/macros/s/AKfycbxKmN_Uo5hIGPm8ITQhM80FxinEL6q1dFiHZAaGR-eRsBb9EDno4C8et31a4mvwzkU9/exec',
  pushApi: 'https://endearing-frangollo-dc109d.netlify.app/.netlify/functions/owner-api',

/* 🛒 업체 — 사장님 「원당은 발주(콩나물, 주류, 음료수, 백석(대파김치))만 존재 · 원당은 계산이 필요 없고 그냥 수량으로 (미락 −,+ 처럼)」
   원당 매장은 연중무휴 · 업체 정기휴무 정함 없음 · 주류도 언제든 → 예약 없이 바로 나감 */
const SUPS = [
  { key:'콩나물', emoji:'🌱', items:['콩나물'] },
  { key:'주류',   emoji:'🍶', items:['참이슬후래쉬','처음처럼','새로','진로','참이슬빨뚜','카스','테라','켈리','일품진로','복분자','청하','매화수'] },
  { key:'음료수', emoji:'🥤', items:['콜라','사이다','제로콜라','파인애플'] },
  { key:'백석',   emoji:'🥬', items:['대파김치'] },
];
/* 🧽 청소 — 사장님이 정한 그대로 (26-10-18) · 위 주방 · 아래 홀 · 한 달 안에 / 기름확인은 3달 간격
   「냉장고의 경우 아코디언인데 각 냉장고 별로 · 동시에 다 하기 어려운 것이 이유 · 기름확인도 아코디언 · 각 카드별로 색칠」
   ⚠️ 같은 목록이 사장앱 서버(_owner.mjs CLEAN_WONDANG)에도 있음 — 주마다 알림용. 바꾸면 둘 다 */
const CLEAN = [
  { zone:'🍳 주방', items:[
    { id:'w_oil', label:'기름 확인', every:3, color:'#E08A00', subs:[['w_oil_roof','옥상 확인'],['w_oil_back','창고 뒤 기름통 확인']] },
    { id:'w_hood', label:'주방 후드 청소', every:1, color:'#3182F6' },
    { id:'w_fridge', label:'냉장고 청소', every:1, color:'#21A366', subs:[['w_fr_big','큰 냉장고'],['w_fr_side','찬 냉장고'],['w_fr_meat','고기 냉장고']] },
  ]},
  { zone:'🪑 홀', items:[
    { id:'w_liquor', label:'주류 냉장고 청소', every:1, color:'#8E5CF6' },
    { id:'w_door', label:'현관 유리문 청소', every:1, color:'#F04452' },
    { id:'w_window', label:'창문 · 창틀', every:1, color:'#0AA5A5' },
  ]},
];
/* 📷 하루 3장까지 (26-10-18 사장님 「앞으로는 하루에 4개 밑으로 올릴 수 있게」)
   이유: 손익 GAS 새벽 분석이 5분 안에 원당·백석을 같이 · 한 장 1분쯤 → 하룻밤 4~5장. 많이 올리면 며칠 밀려 「안 들어간 것」처럼 보였음 (10/17·18 8장)
   ⚠️ 이 폰에서 센 것 (두 폰이면 각각 3장) · 금액만 적는 것은 안 셈 */
const 하루한도 = 3;
const 오늘장수 = ()=>{ try{ return +localStorage.getItem('wondang-photos-'+BD_KEY)||0; }catch(e){ return 0; } };
const 장수더하기 = ()=>{ try{ localStorage.setItem('wondang-photos-'+BD_KEY, 오늘장수()+1); }catch(e){} };
const DOC_TYPES = [['마감정산서','📊','매출','마감정산서'],['미락','🧾','미락',''],['관리비','⚡','매장관리비','전기 명세서']];
const DIRECT_TYPES = [['배달매출','🛵','배달매출','월 1회'],['가게내부카드','💳','가게내부카드','월 합계'],['가게외부카드','🛒','가게외부카드','인터넷 주문'],['콩나물','🌾','콩나물',''],['키위','🥝','키위','보성'],['매장관리비','💧','매장관리비','수도 · 숫자'],['기타세금','🧾','기타세금',''],['기타잡비용','🧰','기타잡비용','']];
/* ⚠️ 계정 이름은 원당 손익 그대로 (백석은 「가게카드」 · 원당은 「가게내부카드」「가게외부카드」 — 문서/10_복제_와꾸.md 6번) */

const DAY = ['일','월','화','수','목','금','토'];
const BD = (()=>{ const d=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Seoul'})); if(d.getHours()<8) d.setDate(d.getDate()-1); return d; })();
const BD_KEY = `${BD.getFullYear()}-${String(BD.getMonth()+1).padStart(2,'0')}-${String(BD.getDate()).padStart(2,'0')}`;
const MONTH_KEY = BD_KEY.slice(0,7);
const LIVE = /github\.io$/.test(location.hostname);
const DEVICE = (()=>{ try{ let id=localStorage.getItem('phoneId'); if(!id){ id=Math.random().toString(36).slice(2,6); localStorage.setItem('phoneId',id);} return id; }catch(e){ return 'temp'; } })();
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won = n=>n.toLocaleString('ko-KR')+'원';
let tt; function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),1800); }
function hhmm(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function openSheet(html){ $('#sheet').innerHTML=html; $('#ov').classList.add('show'); }
function closeSheet(){ $('#ov').classList.remove('show'); }
$('#ov').addEventListener('click',e=>{ if(e.target.id==='ov') closeSheet(); });
const recentSame = (sig) => { try{ const o=JSON.parse(localStorage.getItem('store-last-send')||'{}'); return o[sig] && Date.now()-o[sig] < 3*60e3; }catch(e){ return false; } };
const markSent = (sig) => { try{ const o=JSON.parse(localStorage.getItem('store-last-send')||'{}'); Object.keys(o).forEach(k=>{ if(Date.now()-o[k]>10*60e3) delete o[k]; }); o[sig]=Date.now(); localStorage.setItem('store-last-send',JSON.stringify(o)); }catch(e){} };
function b64u(s){ const p='='.repeat((4-s.length%4)%4); const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(b,c=>c.charCodeAt(0)); }

const API = {
  LIVE, RECEIPT_LIVE: LIVE,
  post(url, body){
    if(!LIVE){ console.log('[미리보기] 안 보냄', body); return Promise.resolve(); }
    return fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(()=>{});
  },
  jsonp(url, params, ms=12000){
    if(!LIVE) return Promise.resolve(undefined);
    return new Promise(done=>{
      const cb='_cb'+Date.now()+Math.floor(Math.random()*1e6), sc=document.createElement('script'); let end=false;
      const clean=()=>{ if(end)return; end=true; try{delete window[cb];}catch(e){} sc.remove(); };
      window[cb]=r=>{ clean(); done(r); };
      sc.onerror=()=>{ clean(); done(undefined); }; setTimeout(()=>{ if(!end){ clean(); done(undefined); } },ms);
      sc.src=url+'?'+Object.entries(params).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&')+'&callback='+cb;
      document.body.appendChild(sc);
    });
  },

  photoExists(hash){
    if(!hash) return Promise.resolve(undefined);
    if(!LIVE) return Promise.resolve(demoHashes.has(hash)?{시각:'방금'}:null);
    return this.jsonp(STORE.receiptGas,{action:'사진있나',store:STORE.receiptStore,h:hash},9000)
      .then(r=>(r&&r.ok)?(r.있음?(r.정보||{}):null):undefined);
  },
  async uploadPhoto(q){
    if(!LIVE){ await wait(300); if(q.hash) demoHashes.add(q.hash); return; }
    await this.post(STORE.receiptGas,{base64:q.b64,mime:'image/jpeg',docType:q.docType,store:STORE.receiptStore,fname:q.fname,hash:q.hash});
  },
  direct(분류,금액,날짜,항목명){ return this.post(STORE.receiptGas,{action:'direct',store:STORE.receiptStore,분류,금액,날짜,항목명}); },
};

/* ── 상태 (이 폰) — 식자재 바구니는 날마다 새로 · 청소는 서버가 진실 ── */
const SAVE_KEY='jangsoo-store-wondang';
let S; try{ S=JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); }catch(e){ S=null; }
if(!S || S.day!==BD_KEY) S={ day:BD_KEY, food:{sup:'콩나물', cart:{}, sent:{}} };
function save(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(S)); }catch(e){} }

/* ── 탭 ── */
const TABS=[['t-home','🏠','홈'],['t-food','🥬','식자재발주'],['t-clean','🧽','청소체크'],['t-rcpt','🧾','영수증']];
let cur='t-home';
const RENDER={'t-home':rHome,'t-food':rFood,'t-clean':rClean,'t-rcpt':rRcpt};
function go(id){ cur=id; RENDER[id](); document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); rTabs(); window.scrollTo(0,0); if(id==='t-clean') loadClean(); if(id==='t-home') loadOrders(); }
function rerender(){ RENDER[cur](); rTabs(); }
function rTabs(){ $('#tabs').innerHTML=TABS.map(([id,ic,l])=>`<button data-tab="${id}" aria-current="${id===cur?'page':'false'}"><span class="ic" aria-hidden="true">${ic}</span>${l}</button>`).join(''); }

/* ══════════════ 🏠 홈 — 어제·오늘 넣은 발주 (26-10-26) ══════════════
   사장님 「원당 매장앱(직원)용 홈 화면 · 발주 확인 · 어제 발주 넣은 것 · 오늘 발주 넣은 것 · 업체별로 몇 시에 넣었는지」
   서버 = 원당 발주 GAS ?action=orders (식자재발주_원당 탭 · 두 폰이 같이 봄) · 시각은 26-10-26 부터 기록 (그 전 것은 「-」) */
let ORD = (()=>{ try{ return JSON.parse(localStorage.getItem('wondang-orders')||'null'); }catch(e){ return null; } })();
async function loadOrders(){
  if(!LIVE) return;
  const r=await API.jsonp(STORE.orderGas,{action:'orders'},12000);
  if(r&&r.ok){ ORD=r; try{ localStorage.setItem('wondang-orders',JSON.stringify(r)); }catch(e){} if(cur==='t-home') rHome(); }
}
function rHome(){
  const 업체칸 = list => { if(!list||!list.length) return '<div class="row"><span class="main mut">넣은 발주 없음</span></div>';
    const by={}; list.forEach(x=>{ (by[x.supplier]=by[x.supplier]||[]).push(x); });
    return Object.keys(by).map(k=>{ const s=SUPS.find(z=>z.key===k); return by[k].map(x=>`<div class="row"><span class="main"><b>${s?s.emoji+' ':''}${esc(k)}</b><span class="sub">${esc(x.items)}</span></span><span class="tag ${x.at?'ok':'wait'} num">${esc(x.at||'-')}</span></div>`).join(''); }).join(''); };
  const 날 = k => k ? String(k).replace(/^\d\d\./,'').replace('.','/') : '';
  $('#t-home').innerHTML = `
    <h2>📨 오늘 넣은 발주 <small class="mut" style="font-weight:500">${esc(날(ORD&&ORD.today))}</small></h2><div class="list">${ORD?업체칸(ORD.오늘):'<div class="row"><span class="main mut">불러오는 중…</span></div>'}</div>
    <h2>🗓 어제 넣은 발주 <small class="mut" style="font-weight:500">${esc(날(ORD&&ORD.yesterday))}</small></h2><div class="list">${ORD?업체칸(ORD.어제):'<div class="row"><span class="main mut">불러오는 중…</span></div>'}</div>
    <p class="hint" style="text-align:center;margin-top:12px">업체로 문자가 나간 기록입니다 · 오른쪽은 넣은 시각 · 오전 8시 전은 전날 영업으로 셉니다</p>
    <button class="big-btn sec" data-tab="t-food">🥬 식자재 발주하러 가기</button>`;
}

/* ══════════════ 🥬 식자재 발주 ══════════════
   ⚠️ 원당 서버는 바구니가 없음 → 이 폰에 담고 「보내기」 때 업체별 문자 (옛 원당 발주앱 food.html 과 같은 서버·같은 꼴)
   ⚠️ 두 폰이 같은 바구니를 보지 않음 — 한 사람이 보내면 다른 폰엔 「오늘 보낸 발주」가 안 보임 (확인 필요 · 필요하면 원당 서버를 백석처럼 바꿔야) */
const supOf=k=>SUPS.find(s=>s.key===k)||SUPS[0];
const qOf=(sup,item)=>S.food.cart[sup+':'+item]||0;
const supCount=s=>s.items.filter(i=>qOf(s.key,i)>0).length;
function 배달날(){ const d=new Date(BD); d.setDate(d.getDate()+1); return `${d.getMonth()+1}/${d.getDate()}(${DAY[d.getDay()]})`; }
function 문자들(){ return SUPS.map(s=>{ const its=s.items.filter(i=>qOf(s.key,i)>0).map(i=>`${i} ${qOf(s.key,i)}`); return its.length?{supplier:s.key,emoji:s.emoji,items:its,body:`[원당점 발주 ${배달날()}]\n${its.join(', ')}`}:null; }).filter(Boolean); }
function rFood(){
  const f=S.food, sup=supOf(f.sup), 나감=Object.keys(f.sent||{});
  $('#t-food').innerHTML = `
    ${나감.length?`<div class="banner green"><span class="em">📨</span><div><b>오늘 보낸 발주</b><span>${나감.map(k=>`${supOf(k).emoji} ${k} ${f.sent[k]}`).join(' · ')}</span></div></div>`:''}
    <div class="supbar" role="group" aria-label="업체">${SUPS.map(s=>{const n=supCount(s);return `<button class="${f.sent[s.key]?'sent':''}" data-act="sup" data-v="${s.key}" aria-pressed="${s.key===f.sup}">${s.emoji} ${s.key}${n?`<span class="cnt num">${n}</span>`:''}</button>`;}).join('')}</div>
    <div class="list">${sup.items.map(it=>{ const q=qOf(sup.key,it); return `<div class="row"><span class="main">${esc(it)}</span><span class="qty"><button data-act="fq" data-k="${esc(sup.key+':'+it)}" data-d="-1" aria-label="${esc(it)} 줄이기">−</button><output class="num">${q}</output><button data-act="fq" data-k="${esc(sup.key+':'+it)}" data-d="1" aria-label="${esc(it)} 늘리기">+</button></span></div>`; }).join('')}</div>
    <button class="big-btn" data-act="fpreview" ${문자들().length?'':'disabled'}>발주 보내기 (${문자들().length}곳)</button>
    <p class="hint" style="text-align:center;margin-top:10px">원당은 연중무휴 · 누르면 바로 업체로 나갑니다 · ${배달날()} 받음</p>`;
}
function 미리보기(){
  const ms=문자들(); if(!ms.length) return;
  openSheet(`<h2>이렇게 보냅니다</h2>${ms.map(m=>`<div class="list" style="margin-bottom:10px"><div class="row"><span class="main"><b>${m.emoji} ${esc(m.supplier)}</b><span class="sub" style="white-space:pre-line">${esc(m.body)}</span></span></div></div>`).join('')}
    <button class="big-btn" data-act="fsend">보내기</button><button class="big-btn sec" data-act="close">더 담기</button>`);
}
async function 보내기(b){
  const ms=문자들(); if(!ms.length) return; const sig='food:'+ms.map(m=>m.body).join('|');
  if(recentSame(sig)){ closeSheet(); toast('방금 똑같은 발주가 이미 나갔습니다'); return; }
  b.disabled=true; markSent(sig);
  // ⚠️ 답장을 기다리지 않음 (no-cors) — 기다리다 「실패」를 보고 또 누르면 문자가 두 번 감 (9/17 주류 6통 사고)
  API.post(STORE.orderGas,{type:'food_order',branch:'wondang',delay_to_tuesday:false,messages:ms.map(m=>({supplier:m.supplier,phone:'',body:m.body,channel:'SMS',items:m.items}))}).catch(()=>toast('⚠️ 인터넷이 끊겨 못 보냈을 수 있습니다'));
  const t=hhmm(); ms.forEach(m=>{ S.food.sent[m.supplier]=t; SUPS.find(s=>s.key===m.supplier).items.forEach(i=>delete S.food.cart[m.supplier+':'+i]); });

}

      const bm=await Promise.race([createImageBitmap(file,{imageOrientation:'from-image'}), new Promise((_,no)=>setTimeout(()=>no(new Error('느림')),3000))]);
      let w=bm.width,h=bm.height; const M=1600; if(w>M||h>M){ if(w>h){h=Math.round(h*M/w);w=M;}else{w=Math.round(w*M/h);h=M;} }
      const c=document.createElement('canvas'); c.width=w;c.height=h; c.getContext('2d').drawImage(bm,0,0,w,h); bm.close&&bm.close();
      const url=c.toDataURL('image/jpeg',0.85); const t=document.createElement('canvas'); const sc=120/Math.max(w,h); t.width=w*sc;t.height=h*sc; t.getContext('2d').drawImage(c,0,0,t.width,t.height);

    $('#upN').textContent=n?`✅ 다 올라갔어요! (${n}장)`:'⚠️ 못 올라간 사진이 있어요'; $('#upT').textContent=n?'새벽에 자동으로 장부에 들어갑니다':'목록에서 「다시」를 눌러 주세요'; $('#upW').textContent=''; $('#upBar').style.width='100%';
    setTimeout(()=>{ o.classList.remove('show'); $('#upW').textContent='📵 다 올라갈 때까지 화면을 끄지 마세요'; },1300); } }
function 올림갱신(){ const o=$('#upOv'); if(!o||!o.classList.contains('show')) return;
  const 할=R.queue.filter(q=>['대기','업로드중','준비중','완료'].includes(q.status)), 끝=할.filter(q=>q.status==='완료').length;
  $('#upN').textContent=`영수증 택배 출발! ${끝}/${할.length}장`; $('#upBar').style.width=(할.length?끝/할.length*100:0)+'%'; }
async function runQueue(){
  R.autoSend = true;   // 아직 준비 중인 사진도 준비되면 바로 보냄
  if(R.running) return;
  R.running=true; rerender(); 올림창(true);
  const 할것=()=>R.queue.find(q=>q.status==='대기'&&q.b64);
  const 일꾼=async()=>{ let q; while((q=할것())) await 한장(q); };
  await Promise.all([일꾼(),일꾼()]);   // 두 장씩
  R.running=false; rerender(); 올림창(false);
  const n=R.queue.filter(q=>q.status==='완료').length; if(n) toast(`✅ 영수증 ${n}장 보냄. 새벽에 자동 분석됩니다`);
  if(!R.queue.some(q=>q.status==='준비중')) R.autoSend=false;
  setTimeout(뒤확인,25000);
}


/* ── 누르기 ── */
document.addEventListener('click', async e=>{
  const b=e.target.closest('button,[data-act]'); if(!b) return;
  if(b.dataset.tab){ go(b.dataset.tab); return; }
  switch(b.dataset.act){
    case 'sup': S.food.sup=b.dataset.v; save(); rerender(); break;
    case 'fq': { const k=b.dataset.k, n=Math.max(0,(S.food.cart[k]||0)+(+b.dataset.d)); if(n) S.food.cart[k]=n; else delete S.food.cart[k]; save(); rerender(); break; }
    case 'fpreview': 미리보기(); break;
    case 'fsend': 보내기(b); break;
    case 'cl': 청소누름(b); break;
    case 'pushon': turnPushOn(); break;
    case 'close': closeSheet(); break;
    case 'rdel': R.queue.splice(+b.dataset.i,1); rerender(); break;
    case 'rretry': { const q=R.queue[+b.dataset.i]; if(q){ q.status='대기'; q.err=''; } runQueue(); break; }
    case 'rfailok': lsSet(FAILED,[]); rerender(); break;
    case 'rsubmit': runQueue(); break;
    case 'rdir': R.dir=b.dataset.v; R.memo=''; rerender(); break;
    case 'rdirect': { const amt=numAmt(); if(!(R.dir&&amt>0&&R.date)||b.disabled) break; b.disabled=true;
      const dir=R.dir, date=R.date, memo=R.memo, sig='direct:'+[dir,amt,date,memo].join('|');
      if(recentSame(sig) && !confirm(`방금 ${dir} ${won(amt)}을 기록했습니다. 정말 또 기록할까요?`)){ b.disabled=false; break; }
      markSent(sig);
      R.dir='';R.amt='';R.memo=''; rerender(); toast(`기록함 · ${dir} ${won(amt)}`);
      API.direct(dir,amt,date,memo).catch(()=>toast('⚠️ 인터넷이 끊겨 못 보냈을 수 있습니다'));
      break; }
  }
});
document.addEventListener('change', async e=>{
  if(e.target.dataset.act!=='rcpt') return;
  R.doc = e.target.dataset.v;
  let files=[...e.target.files]; e.target.value='';
  const 남은 = 하루한도 - 오늘장수() - R.queue.filter(q=>['준비중','대기','업로드중'].includes(q.status)).length;
  if(files.length>남은){ files=files.slice(0,Math.max(0,남은)); toast(남은>0?`오늘은 ${하루한도}장까지 · ${남은}장만 넣었습니다. 나머지는 내일 올려 주세요`:`오늘은 ${하루한도}장을 다 올렸습니다. 나머지는 내일 올려 주세요`); if(!files.length) return; }
  /* ⚠️ 26-10-02 「사진 찍고 바로바로 안 뜸 · 올릴 목록이 뜰 때 있고 안 뜰 때 있음」
     전에는 사진을 다 줄인 뒤에야 목록에 넣었습니다. 큰 사진은 줄이는 데 1~3초 → 그동안 아무것도 안 보임.
     → 먼저 「준비 중」으로 목록에 넣고, 줄이기는 뒤에서 하나씩. 지문·「전에 올렸나」도 이때 미리 물어 둡니다 */
  const 새것 = files.map(f=>({docType:R.doc,fname:f.name,file:f,b64:null,thumb:'',hash:fingerprint(f),status:'준비중'}));
  R.queue.push(...새것); rerender();
  for(const q of 새것){
    try{ const {b64,thumb}=await shrink(q.file); q.b64=b64; q.thumb=thumb; if(q.status==='준비중') q.status='대기'; }
    catch(err){ q.status='오류'; q.err='사진을 읽지 못했습니다. 다시 찍어 주세요'; }
    q.file=null; if(cur==='t-rcpt') rerender();
    미리확인(q);
    if(R.autoSend && q.status==='대기') runQueue();   // 「모두 제출」을 이미 눌렀으면 준비되는 대로 보냄
  }
});
document.addEventListener('input', e=>{
  if(e.target.id==='rAmt'){ const el=e.target, back=el.value.length-el.selectionStart, n=el.value.replace(/[^0-9]/g,'');
    el.value=n?Number(n).toLocaleString('ko-KR'):''; R.amt=el.value; const p=Math.max(0,el.value.length-back); try{el.setSelectionRange(p,p);}catch(_){}
    $('#rDirBtn').disabled=!(R.dir&&numAmt()>0&&R.date); }
  if(e.target.id==='rDate'){ R.date=e.target.value; $('#rDirBtn').disabled=!(R.dir&&numAmt()>0&&R.date); }
  if(e.target.id==='rMemo'){ R.memo=e.target.value; }
});
