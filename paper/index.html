<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="연습장">
<meta name="theme-color" content="#efebe3">
<link rel="apple-touch-icon" href="icon-180.png">
<title>펜슬 연습장</title>
<style>
:root{
  --bar:#efebe3; --ink:#26231f; --mute:#8a847a; --line:#d9d3c7; --on:#26231f; --onT:#fff;
  --desk:#cfc9bd; --paper:#fffdf8; --accent:#c2410c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--desk);color:var(--ink);
  font:15px/1.3 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 10px;background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.grp{display:flex;align-items:center;gap:3px}
.sep{width:1px;height:24px;background:var(--line);margin:0 3px}
button{font:inherit;color:inherit;background:none;border:0;border-radius:10px;min-width:38px;height:40px;padding:0 6px;
  display:inline-flex;align-items:center;justify-content:center;gap:4px;cursor:pointer}
button:active{background:#0001}
button:disabled{opacity:.3}
button.on{background:var(--on);color:var(--onT)}
button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dot{width:20px;height:20px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1.5px #0002}
button.on .dot{box-shadow:0 0 0 2px var(--bar),0 0 0 4px var(--onT)}
.sz{min-width:34px}
.sz i{display:block;border-radius:50%;background:currentColor}
.chip{border:1px solid var(--line);background:#fff;font-weight:600;white-space:nowrap;padding:0 10px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#wipe{color:#5b6068}
#tm{font-variant-numeric:tabular-nums;font-weight:600;min-width:84px;border:1px solid var(--line);background:#fff}
#tm.run{background:var(--accent);border-color:var(--accent);color:#fff}
#pn{min-width:44px;text-align:center;font-variant-numeric:tabular-nums;color:var(--mute)}
#calcBtn.on{background:#3a3b3d}
#paper{position:relative;flex:1;overflow:hidden;touch-action:none}
#paper canvas{position:absolute;left:0;top:0}
#sb{position:absolute;right:3px;width:5px;border-radius:3px;background:#0003;pointer-events:none;transition:opacity .4s;opacity:0}
#heads{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sh{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding-right:12px;pointer-events:none}
.sh>*{pointer-events:auto}
.sh .chip{height:36px;max-width:300px;min-width:0}
.sh .sh-q{min-width:84px}
.sh input{width:96px;height:36px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px;font:inherit;color:inherit;
  -webkit-user-select:text;user-select:text}
.sh .sh-w{color:var(--accent);border-color:#e9b9a3}
.sh .sh-w.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sh .sh-x{margin-left:auto;color:var(--mute);min-width:36px;height:36px;font-size:13px}
#selbar{position:absolute;display:none;gap:4px;background:#26231f;border-radius:12px;padding:4px;z-index:5;box-shadow:0 4px 16px #0003}
#selbar.show{display:flex}
#selbar button{color:#fff;height:36px;font-size:14px;font-weight:600}
#menu{position:fixed;z-index:20;background:#fff;border-radius:14px;box-shadow:0 8px 30px #0003;padding:8px;min-width:250px;display:none}
#menu.show{display:block}
#menu h4{margin:6px 8px;font-size:12px;color:var(--mute);font-weight:600}
#menu button{width:100%;justify-content:flex-start;height:44px}
#menu .row{display:flex;gap:4px}
#menu .row button{justify-content:center}
#menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.sheet{position:fixed;inset:0;z-index:25;background:#0004;display:none;align-items:flex-start;justify-content:center;padding-top:calc(env(safe-area-inset-top) + 60px)}
.sheet.show{display:flex}
.sheetIn{background:#fff;border-radius:16px;width:min(560px,94vw);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 10px 40px #0004}
.sheetIn header{display:flex;align-items:center;gap:6px;padding:10px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;background:#0000000d;border-radius:12px;padding:3px}
.tabs button{height:36px;font-weight:600;color:var(--mute)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0002}
.rows{overflow-y:auto;touch-action:pan-y;padding:6px}
.rows button{width:100%;justify-content:flex-start;text-align:left;height:auto;min-height:46px;padding:8px 12px;gap:10px}
.rows button.on{background:#fbe9e0;color:var(--ink)}
.rows .n{color:var(--mute);font-variant-numeric:tabular-nums;min-width:52px}
.rows .t{flex:1}
.rows .c{color:var(--mute);font-size:13px}
.rows .w{background:var(--accent);color:#fff;border-radius:10px;padding:1px 8px;font-size:13px;font-weight:700}
#list{position:fixed;inset:0;z-index:10;background:#f6f3ed;display:none;flex-direction:column}
#list.show{display:flex}
#list>header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;border-bottom:1px solid var(--line)}
#lsub{display:flex;align-items:center;gap:8px;padding:10px 16px 0;flex-wrap:wrap}
#lsub:empty{display:none}
#lsub h3{margin:0 0 0 4px;font-size:17px}
#grid{flex:1;overflow-y:auto;touch-action:pan-y;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;align-content:start}
#grid.notes{display:flex;flex-direction:column;align-items:center;gap:22px}
#grid .rows{grid-column:1/-1;padding:0;background:#fff;border-radius:12px}
.card{background:none;height:auto;padding:0;flex-direction:column;align-items:stretch;border-radius:10px;text-align:left}
.card canvas{width:100%;aspect-ratio:1000/1414;background:var(--paper);border-radius:8px;box-shadow:0 1px 4px #0002}
.card.cur canvas{outline:3px solid var(--accent)}
.card b{display:block;margin-top:6px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{color:var(--mute);font-size:12px}
.note{width:min(900px,100%);height:auto;padding:0;flex-direction:column;align-items:stretch;text-align:left;flex:none}
.note .nh{display:flex;align-items:baseline;gap:10px;padding:0 4px 6px}
.note .nh b{font-size:16px}
.note .nh small{color:var(--mute)}
.note canvas{width:100%;display:block;background:var(--paper);border-radius:10px;box-shadow:0 1px 5px #0002}
.empty{color:var(--mute);padding:24px;text-align:center;grid-column:1/-1}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#26231fe6;color:#fff;padding:10px 16px;border-radius:12px;
  font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30}
#toast.show{opacity:1}

/* ── 계산기 (카시오 JS-40B 모양) — 크기는 글자 크기 하나로 (가로 30em) ── */
#calc{position:fixed;z-index:12;width:30em;font-size:10px;border-radius:1.8em;overflow:hidden;display:none;touch-action:none;
  box-shadow:0 1.2em 3em #0005,0 0 0 .15em #1c1c1e;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#fff}
#calc.show{display:block}
.c-head{background:#151517;padding:1.4em 1.8em .9em}
.c-top{display:flex;align-items:center;gap:1.2em;cursor:grab}
.c-brand{font-weight:800;font-size:1.9em;letter-spacing:.06em}
.c-solar{width:8em;height:2.4em;background:linear-gradient(135deg,#3a2522,#241615);border-radius:.2em;box-shadow:inset 0 0 0 .1em #000}
.c-model{margin-left:auto;font-size:.95em;color:#ddd;display:flex;align-items:baseline;gap:.4em;white-space:nowrap}
.c-model b{font-size:2em;line-height:1}
.c-min{color:#bbb;min-width:3em;height:2.6em;font-size:1.6em;padding:0;margin-left:.4em}
.c-lcd{margin-top:1.1em;background:linear-gradient(#c9cec7,#b9bfb6);border-radius:.5em;padding:.4em 1em .5em;box-shadow:inset 0 .25em .5em #0006;color:#1d201c}
.c-ind{display:flex;gap:1.2em;height:1.4em;font-size:1.05em;font-weight:700}
.c-ind i{font-style:normal;opacity:0}
.c-ind i.on{opacity:1}
.c-num{text-align:right;font-family:"DIN Alternate","Avenir Next Condensed","SF Mono",Menlo,monospace;font-weight:600;font-size:4.2em;line-height:1.05;
  letter-spacing:.02em;white-space:nowrap;overflow:hidden}
.c-sw{display:flex;align-items:flex-end;gap:.9em;padding:.9em 1.6em 1.1em;background:#151517}
.c-slide{display:flex;flex-direction:column;align-items:center;gap:.35em}
.c-slide .lb{display:flex;gap:0}
.c-slide button{min-width:0;height:auto;padding:.1em .18em;font-size:.78em;color:#aaa;border-radius:.3em}
.c-slide button.on{color:#fff;background:#3a3b3e}
.c-track{width:100%;height:.9em;border-radius:.45em;background:#2a2b2e;box-shadow:inset 0 .1em .2em #000;position:relative}
.c-track i{position:absolute;top:0;height:.9em;width:1.6em;border-radius:.45em;background:#8b8d91;transition:left .15em}
.c-tax{display:flex;gap:.7em;margin-left:auto;flex:none}
.c-tax .k{width:4.3em;height:2.9em}
.c-keys{display:grid;grid-template-columns:repeat(5,1fr);gap:1em 1.1em;padding:1.4em 1.8em 2em;
  background:repeating-linear-gradient(90deg,#0000 0 .2em,#ffffff0d .2em .4em),linear-gradient(160deg,#a9abae,#7d7f83)}
.k{min-width:0;height:3.7em;border-radius:.65em;font-size:1.75em;font-weight:500;padding:0;color:#fff;
  background:linear-gradient(#5b5d61,#47494c);box-shadow:0 .2em 0 #232426,inset 0 .08em 0 #ffffff30;border:.08em solid #2b2c2e}
.k:active,.k.hit{transform:translateY(.12em);box-shadow:0 .08em 0 #232426;filter:brightness(1.25)}
.k small{font-size:.62em;font-weight:700;letter-spacing:-.02em}
.k.n{background:linear-gradient(#26272a,#141517);font-size:2.2em}
.k.m{background:linear-gradient(#8a8c90,#77797d);color:#2f3033;border-color:#4d4f52;font-weight:700}
.k.c{color:#f39a3c;font-weight:700}
.k.op{font-size:2.2em}
.k.plus{grid-row:span 2;height:auto}
.c-grip{position:absolute;right:0;bottom:0;width:3.2em;height:3.2em;cursor:nwse-resize;
  background:linear-gradient(135deg,#0000 55%,#ffffff70 55% 62%,#0000 62% 72%,#ffffff70 72% 79%,#0000 79%)}
</style>
</head>
<body>
<header id="bar">
  <div class="grp">
    <button id="bList" aria-label="모든 장 · 오답노트"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg></button>
  </div>
  <div class="grp" id="tools">
    <button data-tool="pc" aria-label="연습 연필"><svg viewBox="0 0 24 24" style="stroke:#6e7177"><path d="M16.5 3.5l4 4L8 20H4v-4z"/><path d="M14 6l4 4"/><path d="M4 16l4 4" stroke-width="2.6"/></svg></button>
    <span class="sep"></span>
    <button data-tool="pen" data-color="#26231f" aria-label="검정 펜"><i class="dot" style="background:#26231f"></i></button>
    <button data-tool="pen" data-color="#1f4fd1" aria-label="파랑 펜"><i class="dot" style="background:#1f4fd1"></i></button>
    <button data-tool="pen" data-color="#d22f27" aria-label="빨강 펜"><i class="dot" style="background:#d22f27"></i></button>
    <button data-tool="hl" data-color="#ffd400" aria-label="형광펜"><svg viewBox="0 0 24 24"><path d="M15 4l5 5-9 9H6v-5z"/><path d="M4 21h8" stroke="#e6b800" stroke-width="3"/></svg></button>
    <button data-tool="er" aria-label="지우개"><svg viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M4.5 15.5l9-9a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11 19H8z"/><path d="M9 11l5 5"/></svg></button>
    <button data-tool="lasso" aria-label="올가미"><svg viewBox="0 0 24 24"><path d="M7 16.5C4.6 15.3 3 13.4 3 11.2 3 7.2 7 4 12 4s9 3.2 9 7.2-4 7.2-9 7.2c-1 0-2-.1-2.9-.4" stroke-dasharray="2.6 2.6"/><path d="M9.5 16.5c0 1.5-1 2.8-2.5 3.5"/><circle cx="8.3" cy="16.4" r="1.4"/></svg></button>
  </div>
  <div class="grp" id="sizes">
    <button class="sz" data-size="0" aria-label="가늘게"><i style="width:4px;height:4px"></i></button>
    <button class="sz" data-size="1" aria-label="보통"><i style="width:7px;height:7px"></i></button>
    <button class="sz" data-size="2" aria-label="굵게"><i style="width:11px;height:11px"></i></button>
  </div>
  <div class="grp">
    <button id="undo" aria-label="되돌리기"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button id="redo" aria-label="다시하기"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  </div>
  <div class="grp">
    <button id="wipe" class="chip">연습 지우기</button>
    <button id="addQ" class="chip">＋ 문제</button>
  </div>
  <div class="grp"><button id="tm" aria-label="이 장 시간 재기">▶ 00:00</button></div>
  <div class="grp">
    <button id="prev" aria-label="앞 장"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span id="pn">1 / 1</span>
    <button id="next" aria-label="뒷 장"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="grp">
    <button id="calcBtn" aria-label="계산기"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><rect x="8" y="6" width="8" height="3"/><path d="M8.5 13h0M12 13h0M15.5 13h0M8.5 17h0M12 17h0M15.5 17h0" stroke-width="2.4"/></svg></button>
    <button id="more" aria-label="더 보기"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
  </div>
</header>
<main id="paper">
  <canvas id="cBg"></canvas><canvas id="cInk"></canvas><canvas id="cLive"></canvas>
  <div id="heads"></div>
  <div id="sb"></div>
  <div id="selbar"><button id="selDup">복제</button><button id="selDel">지우기</button></div>
</main>

<div id="calc">
  <div class="c-head">
    <div class="c-top" id="cDrag"><span class="c-brand">CASIO</span><span class="c-solar"></span><span class="c-model">JS-40B <b>14</b></span><button class="c-min" id="cMin" aria-label="계산기 접기">–</button></div>
    <div class="c-lcd">
      <div class="c-ind"><i data-i="m">M</i><i data-i="neg">−</i><i data-i="k">K</i><i data-i="e">E</i></div>
      <div class="c-num" id="cNum">0.</div>
    </div>
  </div>
  <div class="c-keys" id="cKeys"></div>
  <div class="c-grip" id="cGrip"></div>
</div>

<div id="menu">
  <h4>종이</h4>
  <div class="row"><button data-bg="plain">무지</button><button data-bg="line">줄</button><button data-bg="grid">모눈</button></div>
  <h4>펜 느낌 (검정·파랑·빨강 펜)</h4>
  <div class="row"><button data-kind="ball">볼펜</button><button data-kind="fount">만년필</button><button data-kind="sign">사인펜</button></div>
  <hr>
  <button id="newPage">＋ 새 장 (다른 과목·다른 날)</button>
  <button id="tmReset">이 장 시간 0으로</button>
  <hr>
  <button id="share">이 장을 사진으로 내보내기</button>
  <button id="clear">이 장 전부 비우기 (되돌리기 됨)</button>
</div>

<div id="pick" class="sheet">
  <div class="sheetIn">
    <header><div class="tabs" id="pickTabs"></div><span style="flex:1"></span><button id="pickClose">닫기</button></header>
    <div class="rows" id="pickList"></div>
  </div>
</div>

<section id="list">
  <header>
    <div class="tabs" id="lTabs"><button data-view="all">모든 장</button><button data-view="wrong">오답노트</button></div>
    <span style="flex:1"></span>
    <button id="add2" class="chip">＋ 새 장</button><button id="closeList">닫기</button>
  </header>
  <div id="lsub"></div>
  <div id="grid"></div>
</section>
<div id="toast"></div>

<script>

/* ── 튕기기 — 손가락으로 쓸고 놓으면 조금 더 미끄러짐 (메모 앱처럼) ── */

}

/* ── 되돌리기 ─────────────────────────────── */

    else op.items.forEach(({ s }) => { const i = ss.indexOf(s); if (i >= 0) ss.splice(i, 1); });
  } else if (op.a === 'clear') { p.strokes = back ? op.s.slice() : []; }
  else if (op.a === 'move') { const k = back ? -1 : 1; op.ss.forEach(s => shift(s, op.dx * k, op.dy * k)); }
  else if (op.a === 'addMany') {
    if (back) op.ss.forEach(s => { const i = ss.indexOf(s); if (i >= 0) ss.splice(i, 1); }); else ss.push(...op.ss);
  } else if (op.a === 'qAdd') {

  ['mc', 'MC', 'k m'], ['mr', 'MR', 'k m'], ['mm', 'M−', 'k m'], ['mp', 'M+', 'k m'], ['/', '÷', 'k op'],
  ['neg', '+/−', 'k'], ['7', '7', 'k n'], ['8', '8', 'k n'], ['9', '9', 'k n'], ['*', '×', 'k op'],
  ['c', 'C', 'k c'], ['4', '4', 'k n'], ['5', '5', 'k n'], ['6', '6', 'k n'], ['-', '−', 'k op'],
  ['ac', 'AC', 'k c'], ['1', '1', 'k n'], ['2', '2', 'k n'], ['3', '3', 'k n'], ['+', '+', 'k op plus'],
  ['0', '0', 'k n'], ['00', '00', 'k n'], ['.', '·', 'k n'], ['=', '=', 'k op']
];
const calcEl = $('#calc');
const calcOpen = () => calcEl.classList.contains('show');
function cval() { return parseFloat(C.x) || 0; }
// ADD2: 점 없이 넣은 수는 + − 계산에서 소수 둘째 자리로 (12345 → 123.45)
function opnd(forOp) { let v = cval(); if (C.dp === 'ADD2' && C.typed && !C.x.includes('.') && (forOp === '+' || forOp === '-')) v /= 100; return v; }
function roundRes(v) {
  if (C.rnd === 'F') return v;
  const d = C.dp === 'ADD2' ? 2 : +C.dp, f = Math.pow(10, d), t = +(Math.abs(v) * f).toPrecision(15);
  return Math.sign(v) * (C.rnd === 'CUT' ? Math.floor(t) : Math.floor(t + .5)) / f;
}
function numStr(v) {
  v = +v.toPrecision(14); if (Object.is(v, -0)) v = 0;
  const il = Math.floor(Math.abs(v)).toString().length;
  if (C.rnd !== 'F') { const d = C.dp === 'ADD2' ? 2 : +C.dp; return v.toFixed(Math.min(d, Math.max(0, 14 - il))); }
  return v.toFixed(Math.min(13, Math.max(0, 14 - il))).replace(/\.?0+$/, '') || '0';
}
function show(v) {
  if (!isFinite(v) || Math.abs(v) >= 1e14) { C.err = true; C.x = '0'; return; }
  C.x = numStr(v); C.typed = false;
}
function calcOp(a, op, b) { return op === '+' ? a + b : op === '-' ? a - b : op === '*' ? a * b : b === 0 ? NaN : a / b; }
function result(v) { v = roundRes(+v.toPrecision(15)); show(v); if (!C.err) C.gt = +(C.gt + cval()).toPrecision(15); }
function press(k) {
  if (k === 'ac') { Object.assign(C, { x:'0', entry:false, fresh:true, typed:false, a:null, op:null, K:null, gt:0, err:false, last:k }); return drawCalc(); }
  if (C.err) { if (k === 'c') { C.err = false; C.x = '0'; C.fresh = true; } return drawCalc(); }
  if (/^\d+$/.test(k) || k === '.') {
    if (C.fresh) { C.x = '0'; C.fresh = false; C.typed = true; if (C.last === '=' ) { C.a = null; } }
    if (k === '.') { if (!C.x.includes('.')) C.x += '.'; }
    else for (const d of k) {   // 14자리 넘으면 더 안 들어감 ('00' 은 한 자리씩)
      if (C.x.replace(/[-.]/g, '').length >= 14) break;
      C.x = C.x === '0' ? d : C.x === '-0' ? '-' + d : C.x + d;
    }
    C.entry = true;
  } else if (k === 'bs') {
    if (C.entry && !C.fresh) { C.x = C.x.slice(0, -1); if (C.x === '' || C.x === '-') C.x = '0'; }
  } else if ('+-*/'.includes(k)) {
    if (C.last === k && !C.entry) { C.K = { op:k, v: C.a ?? cval() }; C.op = null; C.a = null; }   // 같은 연산 두 번 → K
    else {
      if (C.op && C.entry) { show(calcOp(C.a, C.op, opnd(C.op))); }
      else if (!C.op) { C.x = String(opnd(k)); show(cval()); }
      C.a = cval(); C.op = k; C.K = null;
    }
    C.entry = false; C.fresh = true;
  } else if (k === '=') {
    if (C.K && !C.op) result(C.K.op === '*' ? C.K.v * cval() : calcOp(opnd(C.K.op), C.K.op, C.K.v));
    else if (C.op) result(calcOp(C.a, C.op, C.entry ? opnd(C.op) : C.a));
    else if (C.entry) result(opnd('+'));
    C.op = null; C.a = null; C.entry = false; C.fresh = true;
  } else if (k === 'pct') {
    const b = cval();
    if (C.op) {
      const a = C.a, r = C.op === '*' ? a * b / 100 : C.op === '/' ? a / b * 100 : C.op === '+' ? a + a * b / 100 : a - a * b / 100;
      result(r); C.op = null; C.a = null;
    } else show(b / 100);
    C.entry = false; C.fresh = true;
  } else if (k === 'sqrt') { const v = cval(); if (v < 0) C.err = true; else show(Math.sqrt(v)); C.entry = true; C.fresh = true; }
  else if (k === 'neg') {
    if (C.entry && !C.fresh) C.x = C.x.startsWith('-') ? C.x.slice(1) : C.x === '0' ? '0' : '-' + C.x;
    else { show(-cval()); C.entry = true; C.fresh = true; }
  } else if (k === 'c') { C.x = '0'; C.entry = false; C.fresh = true; C.typed = false; }
  else if (k === 'mc') C.m = 0;
  else if (k === 'mr') { show(C.m); C.entry = true; C.fresh = true; }
  else if (k === 'mp' || k === 'mm') {
    if (C.op && C.entry) { result(calcOp(C.a, C.op, opnd(C.op))); C.op = null; C.a = null; }
    else if (C.K && C.entry) { result(C.K.op === '*' ? C.K.v * cval() : calcOp(cval(), C.K.op, C.K.v)); }
    C.m = +(C.m + (k === 'mp' ? 1 : -1) * cval()).toPrecision(15);
    C.entry = false; C.fresh = true;
  } else if (k === 'gt') { show(C.gt); C.entry = true; C.fresh = true; }
  else if (k === 'tax+' || k === 'tax-') { result(k === 'tax+' ? cval() * 1.1 : cval() / 1.1); C.entry = true; C.fresh = true; }
  C.last = k;
  drawCalc();
}
function drawCalc() {
  let s = C.x, neg = s.startsWith('-'); if (neg) s = s.slice(1);
  let [i, d] = s.split('.');
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  $('#cNum').textContent = (neg ? '-' : '') + i + '.' + (d || '');
  const on = { m: C.m !== 0, neg, gt: C.gt !== 0, k: !!C.K, e: C.err };
  calcEl.querySelectorAll('.c-ind i').forEach(el => el.classList.toggle('on', !!on[el.dataset.i]));
  calcEl.querySelectorAll('.c-slide').forEach(el => {
    const list = el.dataset.sw === 'rnd' ? RND : DP, v = C[el.dataset.sw], i = list.indexOf(v);
    el.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
    el.querySelector('.c-track i').style.left = (i / (list.length - 1) * 100) + '%';
    el.querySelector('.c-track i').style.transform = 'translateX(-' + (i / (list.length - 1) * 100) + '%)';
  });
}
(function buildCalc() {
  const box = $('#cKeys');
  for (const [k, t, cls] of KEYS) {
    const b = document.createElement('button'); b.className = cls; b.dataset.k = k;
    b.innerHTML = t.length > 2 || k === 'mex' ? '<small>' + t + '</small>' : t;
    box.append(b);
  }
  calcEl.querySelectorAll('.c-slide').forEach(el => {
    const list = el.dataset.sw === 'rnd' ? RND : DP;
    el.innerHTML = '<div class="lb">' + list.map(v => '<button data-v="' + v + '">' + v + '</button>').join('') + '</div><div class="c-track"><i></i></div>';
    el.querySelectorAll('button').forEach(b => b.addEventListener('pointerdown', e => {
      e.preventDefault(); C[el.dataset.sw] = b.dataset.v; pref('calcSw', JSON.stringify({ rnd: C.rnd, dp: C.dp })); drawCalc();
    }));
  });
  // 손을 대는 순간 눌림 (click 을 기다리지 않음 — 빨리 두드려도 안 빠짐)
  calcEl.addEventListener('pointerdown', e => {
    const b = e.target.closest('.k'); if (!b) return;
    e.preventDefault(); b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 90);
    if (b.dataset.k !== 'mex') press(b.dataset.k);
  });
  calcEl.addEventListener('touchstart', e => { if (!e.target.closest('#cMin')) e.preventDefault(); }, { passive:false });
  drawCalc();
})();
function calcKeyboard(e) {
  const map = { Enter:'=', '=':'=', Escape:'ac', Backspace:'bs', Delete:'c', '%':'pct' };
  const k = map[e.key] || ('0123456789.+-*/'.includes(e.key) && e.key.length === 1 ? e.key : null);
  if (k) { e.preventDefault(); press(k); }
}
// 위치·크기 — 위쪽 검은 띠를 끌면 옮겨지고, 오른쪽 아래 모서리를 끌면 커지고 작아짐
const cpos = { x:null, y:null, w:270, open:false };
function placeCalc() {
  const w = Math.max(200, Math.min(cpos.w, innerWidth - 16));
  calcEl.style.fontSize = (w / 30) + 'px';
  const h = calcEl.offsetHeight || w * 1.6;
  if (cpos.x == null) { cpos.x = innerWidth - w - 16; cpos.y = innerHeight - h - 16; }
  const top = $('#bar').getBoundingClientRect().bottom + 4;   // 위 막대(도구·계산기 단추)는 가리지 않음
  cpos.x = Math.max(4, Math.min(cpos.x, innerWidth - w - 4)); cpos.y = Math.max(top, Math.min(cpos.y, innerHeight - h - 4));
  calcEl.style.left = cpos.x + 'px'; calcEl.style.top = cpos.y + 'px';
}
function saveCalc() { pref('calc', JSON.stringify(cpos)); }
function setCalc(open) { cpos.open = open; calcEl.classList.toggle('show', open); $('#calcBtn').classList.toggle('on', open); if (open) placeCalc(); saveCalc(); }
$('#calcBtn').onclick = () => setCalc(!calcOpen());
$('#cMin').addEventListener('click', () => setCalc(false));
(function dragCalc() {
  let d = null;
  const start = (e, mode) => {
    if (e.target.closest('#cMin')) return;
    e.preventDefault(); e.stopPropagation();
    d = { mode, id: e.pointerId, sx: e.clientX, sy: e.clientY, x: cpos.x, y: cpos.y, w: cpos.w };
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
  };
  const move = e => {
    if (!d || e.pointerId !== d.id) return;
    if (d.mode === 'move') { cpos.x = d.x + e.clientX - d.sx; cpos.y = d.y + e.clientY - d.sy; }
    else cpos.w = Math.max(200, Math.min(560, d.w + (e.clientX - d.sx + e.clientY - d.sy) / 2));
    placeCalc();
  };
  const end = e => { if (d && e.pointerId === d.id) { d = null; saveCalc(); } };
  for (const [el, mode] of [[$('#cDrag'), 'move'], [$('#cGrip'), 'size']]) {
    el.addEventListener('pointerdown', e => start(e, mode));
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  }
  try { Object.assign(cpos, JSON.parse(pref('calc') || '{}')); } catch (_) {}
  addEventListener('resize', () => { if (calcOpen()) placeCalc(); });
})();

/* ── 알림 ─────────────────────────────── */
let toT = 0;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toT); toT = setTimeout(() => t.classList.remove('show'), 2000); }

/* ── 시작 ─────────────────────────────── */
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
window.addEventListener('pagehide', flush);
new ResizeObserver(resize).observe(paper);

(async () => {
  const ok = await DB.open();
  if (!ok) toast('이 브라우저에서는 저장이 안 됩니다');
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  pages = (await DB.all()).sort((a, b) => a.created - b.created);
  // 옛 장 옮겨 담기 — 지우는 것 없음 (옛 칸은 그대로 두고 새 칸만 더함)
  //   26-10-31 전: title 하나 · 26-10-31: 장마다 subj·ch·q·wrong 하나 → 26-11-01: 칸 여러 개(qs) · 길이 h
  pages.forEach(p => {
    if (!p.h) p.h = PAGE;
    if (!p.qs) p.qs = [{ id: uid(), y:0, subj: p.subj || '', ch: p.ch ?? null, q: (p.q !== undefined ? p.q : p.title) || '', wrong: !!p.wrong, wrongAt: p.wrongAt || 0 }];
  });
  if (!pages.length) { const p = newPage(); pages.push(p); touch(p); }
  const t = pref('tool'), c = pref('color'), s = pref('size'), k = pref('kind'), last = pref('page');
  if (t) st.tool = t; if (c) st.color = c; if (s !== null && s !== undefined) st.size = +s; if (k && KIND[k]) st.kind = k;
  const i = pages.findIndex(p => p.id === last);
  cur = i >= 0 ? i : pages.length - 1;
  renderHeads(); resize(); syncBtns(); tick();
  if (cpos.open) setCalc(true);
})();
</script>
